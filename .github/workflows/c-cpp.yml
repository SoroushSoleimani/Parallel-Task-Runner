name: C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build & analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make cppcheck

    - name: Static analysis (cppcheck)
      run: |
        cppcheck --enable=all --std=c11 . || echo "cppcheck warnings detected"

    - name: Build project
      run: make
